plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

repositories {
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "cue_my_music" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Mod Menu (vanilla Screen, no Cloth Config needed)
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.name}" }
    }
}

tasks.named('jar') {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    exclude 'com/cuemymusic/client/testing/**'
    doLast {
        def jarFile = archiveFile.get().asFile
        def manifestAttr = "Fabric-Loom-Client-Only-Entries"
        def jarIn = new java.util.jar.JarFile(jarFile)
        def manifest = jarIn.getManifest()
        if (manifest != null) {
            def val = manifest.getMainAttributes().getValue(manifestAttr)
            if (val != null && val.contains("client/testing")) {
                def filtered = val.split(";").findAll { !it.contains("client/testing") }.join(";")
                manifest.getMainAttributes().putValue(manifestAttr, filtered)
                def tmp = new File(jarFile.parent, jarFile.name + ".tmp")
                def jos = new java.util.jar.JarOutputStream(new FileOutputStream(tmp))
                def manifestEntry = new java.util.jar.JarEntry("META-INF/MANIFEST.MF")
                manifestEntry.time = 0
                manifestEntry.lastModifiedTime = java.nio.file.attribute.FileTime.fromMillis(0)
                jos.putNextEntry(manifestEntry)
                manifest.write(jos)
                jos.closeEntry()
                def entries = jarIn.entries()
                while (entries.hasMoreElements()) {
                    def entry = entries.nextElement()
                    if (entry.name == "META-INF/MANIFEST.MF") continue
                    def newEntry = new java.util.jar.JarEntry(entry)
                    newEntry.time = 0
                    newEntry.lastModifiedTime = java.nio.file.attribute.FileTime.fromMillis(0)
                    jos.putNextEntry(newEntry)
                    if (!entry.isDirectory()) {
                        jos.write(jarIn.getInputStream(entry).bytes)
                    }
                    jos.closeEntry()
                }
                jos.close()
                jarIn.close()
                if (!jarFile.delete()) { throw new GradleException("Failed to delete original jar") }
                if (!tmp.renameTo(jarFile)) { throw new GradleException("Failed to rename filtered jar") }
            } else {
                jarIn.close()
            }
        } else {
            jarIn.close()
        }
    }
}

tasks.named('sourcesJar') {
    exclude 'com/cuemymusic/client/testing/**'
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}

test {
    useJUnitPlatform()
    dependsOn tasks.named('jar')
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
