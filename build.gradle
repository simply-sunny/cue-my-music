plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

repositories {
    maven { url = "https://maven.terraformersmc.com/" }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "cue_my_music" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API (screen events for the Pause-screen widget)
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    clientRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

tasks.matching { it.name.startsWith('run') }.configureEach {
    doFirst {
        file("${layout.buildDirectory.get().asFile}/classes/java/main").mkdirs()
        file("${layout.buildDirectory.get().asFile}/resources/client").mkdirs()
    }
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.name}" }
    }
}

tasks.named('jar') {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    outputs.cacheIf { false }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}

test {
    useJUnitPlatform()
    dependsOn tasks.named('jar')
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
