<h1>Install</h1>
<p>For Minecraft 26.3 on Fabric or Quilt. Java 25. Client-side only.</p>
<ol>
<li>Install <a href="https://fabricmc.net/use/">Fabric Loader</a> or Quilt Loader.</li>
<li>Install <a href="https://modrinth.com/mod/fabric-api">Fabric API</a>.</li>
<li>Install <a href="https://modrinth.com/mod/modmenu">Mod Menu</a> 21.0.0 or newer.</li>
<li>Put the jar in <code>mods</code>.</li>
</ol>
